[package]
name = "mamada-reproductor"
version = "1.0.0"
description = "Tauri wrapper for mamada-reproductor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "default",
  "image-png",
  "image-ico",
  "tray-icon"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.4"
