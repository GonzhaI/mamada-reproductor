[package]
name = "mamada-reproductor"
version = "1.0.0"
description = "Tauri wrapper for mamada-reproductor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "fs-all",
  "shell-all",
  "window-all",
  "dialog-all",
  "protocol-all",
  "cli"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"